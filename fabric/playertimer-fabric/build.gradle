plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5' // Use a specific stable version instead of '+'
    id 'maven-publish'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation project(":common:playertimer-core")
    implementation project(":common:timer-core")

    include project(":common:playertimer-core")
    include project(":common:timer-core")
}